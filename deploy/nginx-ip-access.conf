# hhao1121 站点配置（服务器 /etc/nginx/sites-available/hhao1121）
# 说明：443 块与 certbot 托管的 ssl 配置以服务器实际文件为准（certbot 会改写）
# 80 端口设计：
#   - 域名访问 → 301 跳 https（ICP 备案通过后域名恢复即用）
#   - IP 访问（124.220.169.36）→ 直接服务（备案完成前的主访问通道，不受域名拦截影响）
server {
    listen 80;
    server_name hhao1121.cn www.hhao1121.cn order9d.hhao1121.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 80 default_server;
    server_name 124.220.169.36;

    root /var/www/hhao1121/web;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
