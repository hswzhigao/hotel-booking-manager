# hhao1121 站点配置 — 放置到服务器 /etc/nginx/sites-available/hhao1121
# 并软链到 sites-enabled，替换默认站点
server {
    server_name hhao1121.cn www.hhao1121.cn order9d.hhao1121.cn;

    root /var/www/hhao1121/web;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 独立站点路径（后续部署新网站用）
    location /xiany {
        alias /var/www/xiany;
        index index.html;
        try_files $uri $uri/ /xiany/index.html;
    }

    # SPA history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hhao1121.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hhao1121.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}

server {
    listen 80;
    server_name hhao1121.cn www.hhao1121.cn order9d.hhao1121.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 80 default_server;
